<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
        cursor: default;
        background: transparent;
      }

      .mark {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .name {
        margin-top: 14px;
        font-size: 15px;
        font-weight: 600;
        color: #262626;
        letter-spacing: 0.2px;
      }

      @keyframes pulse {
        0% {
          opacity: 0.55;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0.55;
          transform: scale(0.96);
        }
      }
    </style>
  </head>
  <body>
    <img class="mark" src="./icons/icon.png" alt="" />
    <div class="name">BCS Beam</div>
  </body>
</html>
